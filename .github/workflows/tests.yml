name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install deps
        run: pip install pytest numpy scipy
      - name: Run v1 tests
        working-directory: v1-legacy
        run: python -m pytest -q
      - name: Run v2 firmware tests
        working-directory: v2
        run: python -m pytest -q
